name: BEAT
options:
  bundleIdPrefix: com.iacy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.46.0
targets:
  BEAT:
    type: application
    platform: iOS
    sources:
      - path: BEAT
    resources:
      - path: BEAT/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iacy.beat
        PRODUCT_NAME: BEAT
        DEVELOPMENT_TEAM: Y56U8DFD7X
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 11
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BEAT/Resources/Info.plist
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: BEAT App Store
  BEATTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BEATTests
    dependencies:
      - target: BEAT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iacy.beat.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BEAT:
    build:
      targets:
        BEAT: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - BEATTests
